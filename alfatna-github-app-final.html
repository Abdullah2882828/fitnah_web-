function getCorsHeaders(origin: string, allowedOrigins: string[]) {
  const isAllowed = allowedOrigins.includes(origin);
  if(!isAllowed) return null;
  return {
    'Access-Control-Allow-Origin': origin, // محدد وليس *
    'Access-Control-Allow-Methods': 'POST, GET, OPTIONS, DELETE, PUT',
    'Access-Control-Allow-Headers': 'Content-Type',
    'Access-Control-Allow-Credentials': 'true' // مطلوب مع credentials:include
  };
}

function getSameSiteConfig(reqOrigin: string, backendHost: string, envSameSite?: string): 'Lax'|'None'|'Strict' {
  if(envSameSite === 'None' || envSameSite === 'Lax' || envSameSite === 'Strict') return envSameSite;
  try {
    const reqUrl = new URL(reqOrigin);
    const backHost = backendHost.includes('://') ? new URL(backendHost).hostname : backendHost;
    const reqDomain = reqUrl.hostname.split('.').slice(-2).join('.');
    const backDomain = backHost.split('.').slice(-2).join('.');
    if(reqDomain && backDomain && reqDomain === backDomain) return 'Lax'; // same-site: app.alfatna.com + api.alfatna.com
    return 'None'; // cross-site: localhost:5173 vs api.alfatna.com أو vercel.app vs alfatna.com
  } catch { return 'None'; }
}

function isAllowedClientId(id: string, env:any): boolean {
  const allowed = (env.ALLOWED_CLIENT_IDS || env.GITHUB_CLIENT_ID || process.env.ALLOWED_CLIENT_IDS || process.env.GITHUB_CLIENT_ID || '')
    .split(',').map((s:string)=>s.trim()).filter(Boolean);
  return allowed.includes(id);
}

  const allowed = (env.ALLOWED_REDIRECT_URIS || process.env.ALLOWED_REDIRECT_URIS || '')

async function tryRefreshToken(refreshToken: string, env:any) {

    client_secret: env.GITHUB_CLIENT_SECRET || process.env.GITHUB_CLIENT_SECRET,
    grant_type: 'refresh_token',
    refresh_token: refreshToken
  });
  const res = await fetch('https://github.com/login/oauth/access_token', {
    method:'POST',
    headers:{Accept:'application/json','Content-Type':'application/x-www-form-urlencoded'},
    body: params.toString()
